{
  "openapi": "3.1.0",
  "info": {
    "title": "SGS · API de Governança de Dados de Saúde",
    "version": "0.1.0"
  },
  "paths": {
    "/health/live": {
      "get": {
        "tags": [
          "saúde"
        ],
        "summary": "O processo está no ar",
        "operationId": "live_health_live_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthStatus"
                }
              }
            }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "tags": [
          "saúde"
        ],
        "summary": "A API está pronta: o banco responde",
        "operationId": "ready_health_ready_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthStatus"
                }
              }
            }
          },
          "503": {
            "description": "O banco de dados não respondeu",
            "content": {
              "application/problem+json": {}
            }
          }
        }
      }
    },
    "/.well-known/jwks.json": {
      "get": {
        "tags": [
          "autenticação"
        ],
        "summary": "Chaves públicas de verificação dos access tokens",
        "operationId": "jwks__well_known_jwks_json_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Jwks"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/unidades": {
      "post": {
        "tags": [
          "unidades"
        ],
        "summary": "Cadastrar unidade de saúde",
        "description": "006/R1. Responde com a unidade criada, o `Location` dela e o `ETag` da versão.",
        "operationId": "criar_api_v1_unidades_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UnidadeCreate"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UnidadeOut"
                }
              }
            }
          },
          "401": {
            "description": "Sem access token válido",
            "content": {
              "application/problem+json": {}
            }
          },
          "403": {
            "description": "Sem `unidade:create` na área técnica do tipo informado",
            "content": {
              "application/problem+json": {}
            }
          },
          "409": {
            "description": "Já existe unidade com o mesmo CNES ou o mesmo nome no distrito",
            "content": {
              "application/problem+json": {}
            }
          },
          "422": {
            "description": "Campos inválidos, ou tipo de unidade ou distrito inexistente",
            "content": {
              "application/problem+json": {}
            }
          }
        },
        "security": [
          {
            "HTTPBearer": []
          }
        ]
      }
    },
    "/api/v1/dashboard/consultas/unidades-sem-servico": {
      "get": {
        "tags": [
          "dashboard"
        ],
        "summary": "Unidades sem nenhum serviço cadastrado (anti join)",
        "description": "011/R2.1: unidades não inativas sem serviço, no escopo de leitura do usuário.",
        "operationId": "unidades_sem_servico_api_v1_dashboard_consultas_unidades_sem_servico_get",
        "security": [
          {
            "HTTPBearer": []
          }
        ],
        "parameters": [
          {
            "name": "distrito",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "integer",
                  "maximum": 32767,
                  "minimum": 1
                },
                {
                  "type": "null"
                }
              ],
              "description": "Id do distrito sanitário.",
              "title": "Distrito"
            },
            "description": "Id do distrito sanitário."
          },
          {
            "name": "tipo",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "integer",
                  "maximum": 32767,
                  "minimum": 1
                },
                {
                  "type": "null"
                }
              ],
              "description": "Id do tipo de unidade.",
              "title": "Tipo"
            },
            "description": "Id do tipo de unidade."
          },
          {
            "name": "pagina",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 1000000,
              "minimum": 1,
              "description": "Página, a partir de 1.",
              "default": 1,
              "title": "Pagina"
            },
            "description": "Página, a partir de 1."
          },
          {
            "name": "tamanho",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 100,
              "minimum": 1,
              "description": "Itens por página (padrão 20, máximo 100).",
              "default": 20,
              "title": "Tamanho"
            },
            "description": "Itens por página (padrão 20, máximo 100)."
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PaginaOut_UnidadeResumoOut_"
                }
              }
            }
          },
          "401": {
            "description": "Sem access token válido",
            "content": {
              "application/problem+json": {}
            }
          },
          "403": {
            "description": "Sem `dashboard:read`",
            "content": {
              "application/problem+json": {}
            }
          },
          "422": {
            "description": "Filtro mal formado, ou distrito ou tipo inexistente",
            "content": {
              "application/problem+json": {}
            }
          }
        }
      }
    },
    "/api/v1/dashboard/consultas/conciliacao-unidade-equipamento": {
      "get": {
        "tags": [
          "dashboard"
        ],
        "summary": "Conciliação unidade x equipamento (full outer join)",
        "description": "011/R2.2, R2.6: pares, unidades sem equipamento e, só com escopo global e sem filtro,\nequipamentos sem unidade.",
        "operationId": "conciliacao_unidade_equipamento_api_v1_dashboard_consultas_conciliacao_unidade_equipamento_get",
        "security": [
          {
            "HTTPBearer": []
          }
        ],
        "parameters": [
          {
            "name": "distrito",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "integer",
                  "maximum": 32767,
                  "minimum": 1
                },
                {
                  "type": "null"
                }
              ],
              "description": "Id do distrito sanitário.",
              "title": "Distrito"
            },
            "description": "Id do distrito sanitário."
          },
          {
            "name": "tipo",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "integer",
                  "maximum": 32767,
                  "minimum": 1
                },
                {
                  "type": "null"
                }
              ],
              "description": "Id do tipo de unidade.",
              "title": "Tipo"
            },
            "description": "Id do tipo de unidade."
          },
          {
            "name": "pagina",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 1000000,
              "minimum": 1,
              "description": "Página, a partir de 1.",
              "default": 1,
              "title": "Pagina"
            },
            "description": "Página, a partir de 1."
          },
          {
            "name": "tamanho",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 100,
              "minimum": 1,
              "description": "Itens por página (padrão 20, máximo 100).",
              "default": 20,
              "title": "Tamanho"
            },
            "description": "Itens por página (padrão 20, máximo 100)."
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PaginaOut_ConciliacaoOut_"
                }
              }
            }
          },
          "401": {
            "description": "Sem access token válido",
            "content": {
              "application/problem+json": {}
            }
          },
          "403": {
            "description": "Sem `dashboard:read`",
            "content": {
              "application/problem+json": {}
            }
          },
          "422": {
            "description": "Filtro mal formado, ou distrito ou tipo inexistente",
            "content": {
              "application/problem+json": {}
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "ConciliacaoOut": {
        "properties": {
          "unidade_id": {
            "anyOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ],
            "title": "Unidade Id"
          },
          "unidade_nome": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Unidade Nome"
          },
          "distrito": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Distrito"
          },
          "equipamento_id": {
            "anyOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ],
            "title": "Equipamento Id"
          },
          "equipamento_nome": {
