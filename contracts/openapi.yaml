            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Nome Gestor"
          },
          "horario_funcionamento": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Horario Funcionamento"
          },
          "latitude": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Latitude"
          },
          "longitude": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Longitude"
          },
          "status": {
            "type": "string",
            "enum": [
              "ativa",
              "inativa",
              "em_implantacao"
            ],
            "title": "Status"
          },
          "pendencias": {
            "type": "integer",
            "title": "Pendencias"
          },
          "versao": {
            "type": "integer",
            "title": "Versao"
          },
          "criado_em": {
            "type": "string",
            "format": "date-time",
            "title": "Criado Em"
          },
          "atualizado_em": {
            "type": "string",
            "format": "date-time",
            "title": "Atualizado Em"
          }
        },
        "type": "object",
        "required": [
          "id",
          "nome",
          "cnes",
          "cnes_pendente",
          "tipo_unidade_id",
          "distrito_id",
          "cep",
          "endereco",
          "bairro",
          "telefone",
          "nome_gestor",
          "horario_funcionamento",
          "latitude",
          "longitude",
          "status",
          "pendencias",
          "versao",
          "criado_em",
          "atualizado_em"
        ],
        "title": "UnidadeOut",
        "description": "A unidade completa. `versao` é a mesma do cabeçalho `ETag` (006/R3.2)."
      },
      "UnidadeResumoOut": {
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "title": "Id"
          },
          "nome": {
