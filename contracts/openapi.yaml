            "title": "Cnes Pendente"
          },
          "tipo_unidade_id": {
            "type": "integer",
            "title": "Tipo Unidade Id"
          },
          "distrito_id": {
            "type": "integer",
            "title": "Distrito Id"
          },
          "cep": {
