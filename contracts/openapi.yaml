            "title": "Nome"
          },
          "cnes": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Cnes"
          },
          "tipo": {
            "type": "string",
            "title": "Tipo"
          },
          "distrito": {
            "type": "string",
            "title": "Distrito"
          }
        },
        "type": "object",
        "required": [
          "id",
          "nome",
          "cnes",
          "tipo",
          "distrito"
        ],
        "title": "UnidadeResumoOut",
        "description": "Unidade numa consulta de qualidade; `tipo` e `distrito` são os nomes, para leitura."
      }
