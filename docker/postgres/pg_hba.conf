# Autenticação do PostgreSQL no compose (spec 011, R10.3 e R10.4).
# Pelo socket local (healthcheck, scripts de init, `docker compose exec db psql`): sem senha.
# Pela rede: só com TLS e senha SCRAM; conexão TCP sem TLS é recusada.
# TYPE      DATABASE  USER  ADDRESS  METHOD
local       all       all            trust
hostssl     all       all   all      scram-sha-256
hostnossl   all       all   all      reject
