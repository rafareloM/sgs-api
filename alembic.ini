# Alembic. A URL do banco nunca fica aqui: migrations/env.py lê DATABASE_MIGRATION_URL
# (dono do banco) ou, na falta dela, DATABASE_URL.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

# Logs da linha de comando (`alembic upgrade head`). Quando a API migra na subida, os logs
# saem em JSON pela configuração da própria API.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
