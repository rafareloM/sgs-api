# Esteira de qualidade (spec 001, R7). Com a proteção da main descrita no README, um PR só
# entra com os jobs `quality` e `compose-smoke` verdes (R7.2).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sgs
          POSTGRES_PASSWORD: sgs
          POSTGRES_DB: sgs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Os testes de integração criam e apagam bancos neste servidor, em vez de usar testcontainers.
      SGS_TEST_DATABASE_URL: postgresql+asyncpg://sgs:sgs@localhost:5432/sgs_test
    steps:
      - uses: actions/checkout@v7
      # A partir da v8, o setup-uv só publica tags de versão completa (não há "v10").
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
      - name: Dependências travadas
        run: uv sync --frozen
      - name: Lint e formatação
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Regras de arquitetura
        run: uv run lint-imports
      - name: Testes (unidade, integração e arquitetura)
        run: uv run pytest -m "not slow" --cov=src --cov-report=term-missing
      - name: Contrato OpenAPI atualizado
        run: |
          uv run python -m src.tools.export_openapi > /tmp/openapi.yaml
          diff -u contracts/openapi.yaml /tmp/openapi.yaml
      - name: SAST e dependências vulneráveis
        run: |
          uv run bandit -q -r src
          uv run pip-audit

  compose-smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Subir api, db e proxy
        run: docker compose -f docker/compose.yml -f docker/compose.test.yml up -d --build --wait
      - name: /health/ready pelo proxy TLS
        run: curl -fsSk --retry 10 --retry-all-errors --retry-delay 2 https://localhost/health/ready
      - name: Migrações aplicadas na subida (dev)
        run: docker compose -f docker/compose.yml exec -T api alembic current | grep -q '(head)'
      - name: Logs
        if: always()
        run: docker compose -f docker/compose.yml logs --no-color | tail -n 200
