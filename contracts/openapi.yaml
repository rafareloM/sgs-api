              }
            ],
            "title": "Equipamento Tipo"
          },
          "situacao": {
            "$ref": "#/components/schemas/SituacaoConciliacao"
          }
        },
        "type": "object",
        "required": [
          "unidade_id",
          "unidade_nome",
          "distrito",
          "equipamento_id",
          "equipamento_nome",
          "equipamento_tipo",
          "situacao"
        ],
        "title": "ConciliacaoOut",
        "description": "Linha da conciliação unidade x equipamento; o lado que faltar vem nulo. `distrito` é o\nnome do distrito da unidade e `equipamento_tipo`, o nome do tipo do equipamento."
      },
      "HealthStatus": {
        "properties": {
          "status": {
            "type": "string",
            "const": "ok",
            "title": "Status"
          }
        },
        "type": "object",
        "required": [
          "status"
        ],
        "title": "HealthStatus"
      },
      "Jwk": {
        "properties": {
          "kty": {
            "type": "string",
            "title": "Kty"
          },
          "crv": {
            "type": "string",
            "title": "Crv"
          },
          "alg": {
            "type": "string",
            "title": "Alg"
          },
          "use": {
            "type": "string",
            "title": "Use"
          },
          "kid": {
            "type": "string",
            "title": "Kid"
          },
          "x": {
            "type": "string",
            "title": "X"
          },
          "y": {
            "type": "string",
            "title": "Y"
          }
        },
        "type": "object",
        "required": [
          "kty",
          "crv",
          "alg",
          "use",
          "kid",
          "x",
          "y"
        ],
        "title": "Jwk",
        "description": "Chave pública EC P-256 no formato JWK (RFC 7517 e 7518)."
      },
      "Jwks": {
        "properties": {
          "keys": {
            "items": {
              "$ref": "#/components/schemas/Jwk"
            },
            "type": "array",
            "title": "Keys"
          }
        },
        "type": "object",
        "required": [
          "keys"
        ],
        "title": "Jwks"
      },
      "PaginaOut_ConciliacaoOut_": {
        "properties": {
          "itens": {
            "items": {
              "$ref": "#/components/schemas/ConciliacaoOut"
            },
            "type": "array",
            "title": "Itens"
          },
          "total": {
            "type": "integer",
            "title": "Total"
          },
          "pagina": {
            "type": "integer",
            "title": "Pagina"
          },
          "tamanho": {
            "type": "integer",
            "title": "Tamanho"
          }
